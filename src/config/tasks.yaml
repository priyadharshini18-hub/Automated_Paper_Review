text_reader:
  description: >
    Here is the research paper text to analyze:
    
    --- BEGIN PAPER ---
    {paper_content}
    --- END PAPER ---
    
    Return this complete text content for further analysis.
  expected_output: >
    The complete text content of the research paper ready for summarization.
  agent: summarizer_agent
  output_file: output/paper_text.txt


paper_summarizer:
  description: >
    Analyze the research paper text provided in the previous task.
    
    Create a comprehensive summary with the following sections:
    1. **Problem Statement**: What problem does this research address?
    2. **Objectives**: What are the main goals and research questions?
    3. **Keywords**: Identify the keywords used in the research paper.
    4. **Methodology**: What methods, techniques, or approaches were used?
    5. **Results**: What were the key findings and outcomes?
    6. **Strengths**: What are the strengths of the research paper?
    7. **Weaknesses**: What are the weaknesses of the research paper?
    8. **Conclusions**: What are the main takeaways and implications?
    9. **Future Work**: What future directions or improvements does the paper suggest?
    
    Use ONLY the text from the previous task. Do not use external knowledge.
    Format the summary in clear, well-organized sections with headers.
  expected_output: >
    A well-structured research paper summary in markdown format with clearly labeled sections:
    Problem Statement, Objectives, Keywords, Methodology, Results, Strengths, Weaknesses, Conclusions, and Future Work.
    Each section should be concise but comprehensive, capturing the essence of the research.
  agent: summarizer_agent
  context:
    - text_reader
  output_file: output/paper_summary.md


summary_critique:
  description: >
    Critically evaluate the research paper summary by comparing it against the ORIGINAL TEXT.
    
    ORIGINAL PAPER TEXT:
    --- BEGIN PAPER ---
    {paper_content}
    --- END PAPER ---
    
    You also have the generated summary from paper_summarizer.
    
    IMPORTANT: Base your evaluation ONLY on comparing the summary to the original text above.
    Do NOT use any external knowledge or assumptions.
    
    Evaluation criteria:
    1. **Completeness**: Are all 9 required sections present?
    2. **Accuracy**: Does the summary accurately represent what's in the original text?
    3. **Clarity of Objectives**: Are the research objectives clearly identified?
    4. **Technical Depth**: Does the summary capture technical details?
    5. **Result-Conclusion Alignment**: Are conclusions backed by stated results?
    6. **Strengths and Weaknesses**: Are they clearly identified?
    7. **Coverage**: Are important points missing?
    
    Output "APPROVED!" or "REJECTED!" with detailed feedback.
  expected_output: >
    A markdown-formatted decision document that starts with either "APPROVED!" or "REJECTED!" 
    followed by detailed feedback organized with clear headers and bullet points.
  agent: critique_agent
  context:
    - text_reader
    - paper_summarizer
  output_file: output/critique_decision.md


final_report_generation:
  description: >
    Create a comprehensive paper review report as a JSON object.

    ORIGINAL PAPER TEXT:
    --- BEGIN PAPER ---
    {paper_content}
    --- END PAPER ---

    You also have:
    - The summary from paper_summarizer
    - The critique feedback from summary_critique

    Output a valid JSON object with the following structure:
    {
      "title": "Paper title",
      "authors": "Authors if available or null",
      "date_reviewed": "November 27, 2025",
      "executive_summary": "2-3 paragraph high-level overview",
      "problem_statement": "What problem does this research address",
      "research_objectives": ["objective 1", "objective 2"],
      "methodology": "Methods and techniques used with technical details",
      "key_results": "Summary of key findings",
      "metrics": [
        {"name": "metric name", "value": "value", "explanation": "what it means"}
      ],
      "strengths": ["strength 1", "strength 2"],
      "weaknesses": ["weakness 1", "weakness 2"],
      "conclusions": "Main takeaways and implications",
      "future_work": ["future direction 1", "future direction 2"]
    }

    Output ONLY valid JSON. No markdown, no code blocks, no extra text.
  expected_output: >
    A valid JSON object containing all fields. Must be parseable by json.loads().
  agent: synthesizer_agent
  context:
    - text_reader
    - paper_summarizer
    - summary_critique
  output_file: output/final_report.json


